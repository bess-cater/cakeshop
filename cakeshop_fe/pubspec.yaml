name: cakeshop_fe
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  lottie: ^3.3.1
  firebase_core: ^3.12.1
  provider: ^6.1.2
  dotted_border: ^2.1.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  go_router: ^15.1.1
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true


  assets:
    - assets/lottie/cake.json
    - assets/images/ribbon.png
    - assets/images/paper_back.png
    - assets/images/my_text.png
  
    - .env

  fonts:
    - family: Gummy
      fonts:
        - asset: assets/fonts/GummyCandyDemoRegular.ttf
          weight: 700
    - family: Hugh
      fonts:
        - asset: assets/fonts/HughisLife.ttf
          weight: 700
    - family: Lucy
      fonts:
        - asset: assets/fonts/LucySaidOk.ttf
          weight: 700
    - family: Pinko
      fonts:
        - asset: assets/fonts/Pinko.otf
          weight: 700
    # Icons
    - family: CustomIcons
      fonts:
        - asset: assets/icons/CustomIcons.ttf

